<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电表参数配置 - 移动充电</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* iPhone 外框 */
        .iphone-frame {
            width: 393px;
            height: 852px;
            background: #1a1a1a;
            border-radius: 55px;
            padding: 12px;
            box-shadow:
                0 0 0 2px #2a2a2a,
                0 0 0 8px #1a1a1a,
                0 30px 80px rgba(0, 0, 0, 0.5);
            position: relative;
            transform: scale(1.1);
        }

        @media (max-height: 1000px) { .iphone-frame { transform: scale(0.95); } }
        @media (max-height: 900px) { .iphone-frame { transform: scale(0.85); } }
        @media (max-height: 800px) { .iphone-frame { transform: scale(0.75); } }

        /* 灵动岛 */
        .dynamic-island {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 126px;
            height: 37px;
            background: #000;
            border-radius: 22px;
            z-index: 10;
        }

        /* 屏幕内容 */
        .screen {
            width: 100%;
            height: 100%;
            background: #F5F5F5;
            border-radius: 45px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* 状态栏 */
        .status-bar {
            height: 54px;
            background: transparent;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0 20px;
            padding-top: 16px;
            font-size: 15px;
            font-weight: 600;
            color: #000;
        }

        .time {
            font-weight: 600;
            position: absolute;
            left: 35px;
            top: 18px;
        }

        .status-icons {
            display: flex;
            gap: 6px;
            align-items: center;
            position: absolute;
            right: 35px;
            top: 18px;
        }

        /* 信号图标 */
        .signal {
            display: flex;
            gap: 1px;
            align-items: flex-end;
            height: 12px;
        }

        .signal-bar {
            width: 3px;
            background: #000;
            border-radius: 1px;
        }

        .signal-bar:nth-child(1) { height: 4px; }
        .signal-bar:nth-child(2) { height: 6px; }
        .signal-bar:nth-child(3) { height: 8px; }
        .signal-bar:nth-child(4) { height: 10px; }

        /* WiFi 图标 */
        .wifi {
            width: 15px;
            height: 11px;
            position: relative;
        }

        .wifi::before {
            content: '◗';
            font-size: 15px;
            color: #000;
            transform: rotate(45deg);
            display: block;
        }

        /* 电池图标 */
        .battery {
            width: 24px;
            height: 11px;
            border: 1.5px solid #000;
            border-radius: 3px;
            position: relative;
            margin-left: 5px;
            display: flex;
            align-items: center;
            padding: 2px;
        }

        .battery::before {
            content: '';
            position: absolute;
            right: -3px;
            top: 50%;
            transform: translateY(-50%);
            width: 1.5px;
            height: 4px;
            background: #000;
            border-radius: 0 1px 1px 0;
        }

        .battery::after {
            content: '';
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 1px;
        }

        /* 主内容区 */
        .main-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0 16px 110px 16px;
            -webkit-overflow-scrolling: touch;
        }

        /* 隐藏滚动条 */
        .main-content::-webkit-scrollbar {
            display: none;
        }

        .main-content {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 顶部导航栏 */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding: 8px 0;
            margin-left: -8px;
            margin-right: -8px;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            background: transparent;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 0;
            margin: 0;
        }

        .back-btn:active {
            transform: scale(0.9);
            opacity: 0.6;
        }

        .back-btn svg {
            width: 24px;
            height: 24px;
            stroke: #000;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .page-title {
            font-size: 17px;
            font-weight: 600;
            color: #000;
            flex: 1;
            text-align: center;
        }

        /* 刷新按钮 */
        .refresh-btn {
            width: 36px;
            height: 36px;
            background: transparent;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 0;
            margin: 0;
        }

        .refresh-btn:active {
            transform: scale(0.9) rotate(180deg);
            opacity: 0.6;
        }

        .refresh-btn svg {
            width: 20px;
            height: 20px;
            stroke: #000;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 配置卡片 */
        .config-card {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            margin-top: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .param-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .param-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .param-label {
            font-size: 16px;
            color: #000;
            font-weight: 500;
        }

        .param-input {
            width: 120px;
            height: 40px;
            border: 1px solid #E5E5EA;
            border-radius: 10px;
            padding: 0 12px;
            font-size: 15px;
            text-align: right;
            transition: all 0.2s ease;
        }

        .param-input:focus {
            outline: none;
            border-color: #0052CC;
            box-shadow: 0 0 0 4px rgba(0, 82, 204, 0.1);
        }

        /* 保存按钮 */
        .save-btn {
            width: 100%;
            height: 50px;
            background: #0052CC;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 24px;
        }

        .save-btn:active {
            transform: scale(0.98);
            background: #003B99;
        }

        /* 底部菜单栏 */
        .bottom-nav {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 22px;
            display: flex;
            justify-content: space-around;
            padding: 10px 16px;
            position: absolute;
            bottom: 25px;
            left: 16px;
            right: 16px;
            height: 70px;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            cursor: pointer;
            transition: all 0.25s ease;
            flex: 1;
        }

        .nav-item:active {
            transform: scale(0.88);
        }

        .nav-icon {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
        }

        .nav-icon svg {
            width: 100%;
            height: 100%;
            stroke: #8E8E93;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.25s ease;
        }

        .nav-item.active .nav-icon svg {
            stroke: #0052CC;
            stroke-width: 2;
        }

        .nav-label {
            font-size: 11px;
            color: #8E8E93;
            font-weight: 500;
            transition: all 0.25s ease;
        }

        .nav-item.active .nav-label {
            color: #0052CC;
            font-weight: 600;
        }

        /* 底部指示条 */
        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 5px;
            background: #000;
            border-radius: 3px;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="iphone-frame">
        <!-- 灵动岛 -->
        <div class="dynamic-island"></div>

        <!-- 屏幕内容 -->
        <div class="screen">
            <!-- 状态栏 -->
            <div class="status-bar">
                <div class="time">9:41</div>
                <div class="status-icons">
                    <div class="signal">
                        <div class="signal-bar"></div>
                        <div class="signal-bar"></div>
                        <div class="signal-bar"></div>
                        <div class="signal-bar"></div>
                    </div>
                    <div class="wifi"></div>
                    <div class="battery"></div>
                </div>
            </div>

            <!-- 主内容区 -->
            <div class="main-content">
                <!-- 顶部导航栏 -->
                <div class="page-header">
                    <button class="back-btn" onclick="goBack()">
                        <svg viewBox="0 0 24 24">
                            <path d="M15 18l-6-6 6-6"/>
                        </svg>
                    </button>
                    <div class="page-title">电表参数配置</div>
                    <button class="refresh-btn" id="refreshBtn">
                        <svg viewBox="0 0 24 24">
                            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
                        </svg>
                    </button>
                </div>

                <!-- 配置卡片 -->
                <div class="config-card">
                    <div class="param-list">
                        <div class="param-item">
                            <label class="param-label">电压系数</label>
                            <input type="number" class="param-input" id="voltageCoef" value="1.0" step="0.01">
                        </div>
                        <div class="param-item">
                            <label class="param-label">电流系数</label>
                            <input type="number" class="param-input" id="currentCoef" value="1.0" step="0.01">
                        </div>
                        <div class="param-item">
                            <label class="param-label">功率系数</label>
                            <input type="number" class="param-input" id="powerCoef" value="1.0" step="0.01">
                        </div>
                        <div class="param-item">
                            <label class="param-label">电能系数</label>
                            <input type="number" class="param-input" id="energyCoef" value="1.0" step="0.01">
                        </div>
                        <div class="param-item">
                            <label class="param-label">频率系数</label>
                            <input type="number" class="param-input" id="frequencyCoef" value="1.0" step="0.01">
                        </div>
                    </div>
                    <button class="save-btn" id="saveBtn">保存参数</button>
                </div>
            </div>

            <!-- 底部菜单栏 -->
            <div class="bottom-nav">
                <div class="nav-item" onclick="navigateTo('search')">
                    <div class="nav-icon">
                        <svg viewBox="0 0 24 24">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="m21 21-4.35-4.35"/>
                        </svg>
                    </div>
                    <div class="nav-label">充电桩</div>
                </div>
                <div class="nav-item" onclick="navigateTo('record')">
                    <div class="nav-icon">
                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                    </div>
                    <div class="nav-label">记录</div>
                </div>
                <div class="nav-item active">
                    <div class="nav-icon">
                        <svg viewBox="0 0 24 24">
                            <rect x="3" y="8" width="18" height="12" rx="2"/>
                            <path d="M7 8V6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2"/>
                            <line x1="12" y1="11" x2="12" y2="17"/>
                            <line x1="9" y1="14" x2="15" y2="14"/>
                        </svg>
                    </div>
                    <div class="nav-label">调试</div>
                </div>
                <div class="nav-item" onclick="navigateTo('me')">
                    <div class="nav-icon">
                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="8" r="5"/>
                            <path d="M3 21v-2a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v2"/>
                        </svg>
                    </div>
                    <div class="nav-label">我的</div>
                </div>
            </div>

            <!-- 底部指示条 -->
            <div class="home-indicator"></div>
        </div>
    </div>

    <script>
        // 多语言配置
        const i18n = {
            '中文': {
                pageTitle: '电表参数配置',
                voltageCoef: '电压系数',
                currentCoef: '电流系数',
                powerCoef: '功率系数',
                energyCoef: '电能系数',
                frequencyCoef: '频率系数',
                saveParams: '保存参数',
                navSearch: '充电桩',
                navRecord: '记录',
                navDebug: '调试',
                navMe: '我的'
            },
            '繁體中文': {
                pageTitle: '電錶參數配置',
                voltageCoef: '電壓係數',
                currentCoef: '電流係數',
                powerCoef: '功率係數',
                energyCoef: '電能係數',
                frequencyCoef: '頻率係數',
                saveParams: '保存參數',
                navSearch: '充電樁',
                navRecord: '記錄',
                navDebug: '調試',
                navMe: '我的'
            },
            'English': {
                pageTitle: 'Meter Configuration',
                voltageCoef: 'Voltage Coef.',
                currentCoef: 'Current Coef.',
                powerCoef: 'Power Coef.',
                energyCoef: 'Energy Coef.',
                frequencyCoef: 'Frequency Coef.',
                saveParams: 'Save Parameters',
                navSearch: 'Chargers',
                navRecord: 'Records',
                navDebug: 'Debug',
                navMe: 'Me'
            }
        };

        // 更新界面语言
        function updateLanguage(lang) {
            const texts = i18n[lang];
            if (!texts) return;

            document.querySelector('.page-title').textContent = texts.pageTitle;

            const paramLabels = document.querySelectorAll('.param-label');
            paramLabels[0].textContent = texts.voltageCoef;
            paramLabels[1].textContent = texts.currentCoef;
            paramLabels[2].textContent = texts.powerCoef;
            paramLabels[3].textContent = texts.energyCoef;
            paramLabels[4].textContent = texts.frequencyCoef;

            document.getElementById('saveBtn').textContent = texts.saveParams;

            const navLabels = document.querySelectorAll('.nav-label');
            navLabels[0].textContent = texts.navSearch;
            navLabels[1].textContent = texts.navRecord;
            navLabels[2].textContent = texts.navDebug;
            navLabels[3].textContent = texts.navMe;
        }

        // 加载电表参数
        function loadMeterParams() {
            const params = JSON.parse(localStorage.getItem('meterParams') || '{}');
            document.getElementById('voltageCoef').value = params.voltage || 1.0;
            document.getElementById('currentCoef').value = params.current || 1.0;
            document.getElementById('powerCoef').value = params.power || 1.0;
            document.getElementById('energyCoef').value = params.energy || 1.0;
            document.getElementById('frequencyCoef').value = params.frequency || 1.0;
        }

        // 保存电表参数
        function saveMeterParams() {
            const params = {
                voltage: parseFloat(document.getElementById('voltageCoef').value),
                current: parseFloat(document.getElementById('currentCoef').value),
                power: parseFloat(document.getElementById('powerCoef').value),
                energy: parseFloat(document.getElementById('energyCoef').value),
                frequency: parseFloat(document.getElementById('frequencyCoef').value)
            };
            localStorage.setItem('meterParams', JSON.stringify(params));
            alert('参数保存成功！');
        }

        // 返回上一页
        function goBack() {
            window.location.href = 'debug.html';
        }

        // 底部导航跳转函数
        function navigateTo(page) {
            if (page === 'search') {
                window.location.href = 'search.html';
            } else if (page === 'record') {
                window.location.href = 'records.html';
            } else if (page === 'me') {
                window.location.href = 'profile-3menu.html';
            }
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 加载参数
            loadMeterParams();

            // 刷新按钮
            document.getElementById('refreshBtn').addEventListener('click', loadMeterParams);

            // 保存按钮
            document.getElementById('saveBtn').addEventListener('click', saveMeterParams);

            // 恢复语言设置
            const savedLanguage = localStorage.getItem('preferredLanguage') || 'English';
            updateLanguage(savedLanguage);
        });
    </script>
</body>
</html>
