<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>充电桩 - 移动充电</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* iPhone 外框 */
        .iphone-frame {
            width: 393px;
            height: 852px;
            background: #1a1a1a;
            border-radius: 55px;
            padding: 12px;
            box-shadow:
                0 0 0 2px #2a2a2a,
                0 0 0 8px #1a1a1a,
                0 30px 80px rgba(0, 0, 0, 0.5);
            position: relative;
            transform: scale(1.1);
            transform-origin: center;
        }

        /* 响应式缩放 */
        @media (max-height: 1000px) {
            .iphone-frame {
                transform: scale(0.95);
            }
        }

        @media (max-height: 900px) {
            .iphone-frame {
                transform: scale(0.85);
            }
        }

        @media (max-height: 800px) {
            .iphone-frame {
                transform: scale(0.75);
            }
        }

        /* 灵动岛 */
        .dynamic-island {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 126px;
            height: 37px;
            background: #000;
            border-radius: 22px;
            z-index: 10;
        }

        /* 屏幕内容 */
        .screen {
            width: 100%;
            height: 100%;
            background: #F5F5F5;
            border-radius: 45px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* 状态栏 */
        .status-bar {
            height: 54px;
            background: transparent;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0 20px;
            padding-top: 16px;
            font-size: 15px;
            font-weight: 600;
            color: #000;
        }

        .time {
            font-weight: 600;
            position: absolute;
            left: 35px;
            top: 18px;
        }

        .status-icons {
            display: flex;
            gap: 6px;
            align-items: center;
            position: absolute;
            right: 35px;
            top: 18px;
        }

        /* 信号图标 */
        .signal {
            display: flex;
            gap: 1px;
            align-items: flex-end;
            height: 12px;
        }

        .signal-bar {
            width: 3px;
            background: #000;
            border-radius: 1px;
        }

        .signal-bar:nth-child(1) { height: 4px; }
        .signal-bar:nth-child(2) { height: 6px; }
        .signal-bar:nth-child(3) { height: 8px; }
        .signal-bar:nth-child(4) { height: 10px; }

        /* WiFi 图标 */
        .wifi {
            width: 15px;
            height: 11px;
            position: relative;
        }

        .wifi::before {
            content: '◗';
            font-size: 15px;
            color: #000;
            transform: rotate(45deg);
            display: block;
        }

        /* 电池图标 */
        .battery {
            width: 24px;
            height: 11px;
            border: 1.5px solid #000;
            border-radius: 3px;
            position: relative;
            margin-left: 5px;
            display: flex;
            align-items: center;
            padding: 2px;
        }

        .battery::before {
            content: '';
            position: absolute;
            right: -3px;
            top: 50%;
            transform: translateY(-50%);
            width: 1.5px;
            height: 4px;
            background: #000;
            border-radius: 0 1px 1px 0;
        }

        .battery::after {
            content: '';
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 1px;
        }

        /* 主内容区 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0 16px 100px 16px;
            -webkit-overflow-scrolling: touch;
        }

        /* 隐藏主内容区滚动条 */
        .main-content::-webkit-scrollbar {
            display: none;
        }

        .main-content {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 页面标题 */
        .page-title {
            font-size: 20px;
            font-weight: 700;
            color: #000;
            margin-bottom: 16px;
            padding: 8px 0;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .page-title-text {
            flex: 1;
            font-size: 24px;
            font-weight: 700;
        }

        .title-buttons {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .title-search-btn {
            background: #0052CC;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            padding: 0;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            box-shadow: 0 2px 8px rgba(0, 82, 204, 0.25);
            align-items: center;
            justify-content: center;
        }

        .title-search-btn:active {
            transform: scale(0.9);
            background: #003B99;
            box-shadow: 0 1px 4px rgba(0, 82, 204, 0.3);
        }

        .title-search-btn svg {
            width: 20px;
            height: 20px;
            stroke: #fff;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .title-disconnect-btn {
            background: #FF3B30;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            padding: 0;
            cursor: pointer;
            transition: all 0.2s ease;
            display: none;
            box-shadow: 0 2px 8px rgba(255, 59, 48, 0.25);
            align-items: center;
            justify-content: center;
        }

        .title-disconnect-btn.show {
            display: flex;
        }

        .title-disconnect-btn:active {
            transform: scale(0.9);
            background: #E63328;
            box-shadow: 0 1px 4px rgba(255, 59, 48, 0.3);
        }

        .title-disconnect-btn svg {
            width: 20px;
            height: 20px;
            stroke: #fff;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 入户电流设置卡片 - 使用档位选择器样式 */
        .current-setting-card {
            background: #F0F8FF;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        .current-setting-header {
            margin-bottom: 12px;
        }

        .current-setting-title {
            font-size: 15px;
            font-weight: 600;
            color: #000;
            margin-bottom: 0;
        }

        .gear-label-container {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 12px;
        }

        .gear-label {
            font-size: 15px;
            color: #000;
            font-weight: 600;
            text-align: left;
        }

        .current-setting-hint,
        .gear-hint {
            font-size: 11px;
            color: #FF9500;
            font-weight: 500;
        }

        /* 大椭圆容器 - 分段控件样式 */
        .current-options,
        .gear-options {
            display: flex;
            background: #fff;
            border-radius: 20px;
            padding: 3px;
            gap: 3px;
        }

        .current-option,
        .gear-option {
            flex: 1;
            min-width: 0;
            padding: 8px 6px;
            background: #fff;
            border: none;
            border-radius: 17px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 15px;
            font-weight: 600;
            color: #666;
        }

        .current-option:active,
        .gear-option:active {
            transform: scale(0.95);
        }

        .current-option.selected,
        .gear-option.selected {
            background: #0052CC;
            box-shadow: 0 2px 6px rgba(0, 82, 204, 0.25);
            color: #fff;
            font-weight: 700;
        }

        .gear-number {
            font-size: 15px;
            font-weight: 600;
            color: #666;
            transition: all 0.2s ease;
        }

        .gear-option.selected .gear-number {
            color: #fff;
            font-weight: 700;
        }

        /* 系统信息区域 */
        .system-info-section {
            background: rgba(0, 82, 204, 0.08);
            border-radius: 12px;
            padding: 14px 16px;
            margin-top: 16px;
            display: flex;
            flex-direction: column;
        }

        /* 充电桩列表容器 */
        .charger-list-container {
            flex: 1;
            padding-bottom: 100px;
        }

        /* 充电桩列表 */
        .charger-list {
            display: flex;
            flex-direction: column;
        }

        .charger-card {
            background: #fff;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            align-items: center;
            gap: 16px;
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .charger-card-wrapper {
            position: relative;
            margin-bottom: 12px;
        }

        .swipe-delete-btn {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 80px;
            background: #FF3B30;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .swipe-delete-btn svg {
            width: 24px;
            height: 24px;
            stroke: #fff;
            fill: none;
            stroke-width: 2;
        }

        .charger-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #0052CC 0%, #003B99 100%);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .charger-icon img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        .charger-info {
            flex: 1;
            min-width: 0;
        }

        .charger-name {
            font-size: 17px;
            font-weight: 600;
            color: #000;
            margin-bottom: 4px;
        }

        .charger-version {
            font-size: 12px;
            font-weight: 400;
            color: #8E8E93;
            margin-bottom: 6px;
        }

        .charger-status {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .status-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }

        .charger-current {
            font-size: 13px;
            color: #000;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            width: 100%;
            flex-basis: 100%;
        }

        .charger-current-label {
            color: #000;
            font-weight: 500;
        }

        /* 系统信息栏 */
        .system-info-bar {
            background: rgba(0, 82, 204, 0.08);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex-shrink: 0;
        }

        /* 总电流显示区域 */
        .total-current-section {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-bottom: 8px;
        }

        .total-current-item {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .total-current-label {
            font-size: 12px;
            color: #8E8E93;
            font-weight: 500;
        }

        .total-current-value {
            font-size: 18px;
            color: #0052CC;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        /* 子项信息行 */
        .sub-items-info {
            display: flex;
            flex-direction: column;
            padding-top: 4px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .info-group {
            display: flex;
            flex: 1;
            align-items: baseline;
            gap: 6px;
        }

        .info-group.left {
            justify-content: flex-start;
        }

        .info-group.right {
            justify-content: flex-end;
        }

        .info-group-label {
            font-size: 12px;
            color: #8E8E93;
            font-weight: 500;
        }

        .info-group-value {
            font-size: 16px;
            color: #0052CC;
            font-weight: 700;
        }

        /* 统一进度条 */
        .unified-progress-container {
            width: 100%;
            padding: 0;
            margin: 12px 0;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(0, 82, 204, 0.15);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #0052CC 0%, #0066FF 100%);
            border-radius: 4px;
            transition: width 0.5s ease;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .device-status {
            color: #000;
            font-weight: 500;
        }

        .usage-status {
            background: #0052CC;
            color: #fff;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #34C759;
        }

        .status-dot.offline {
            background: #8E8E93;
        }

        .enter-arrow {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        .enter-arrow svg {
            width: 100%;
            height: 100%;
            stroke: #C7C7CC;
            fill: none;
            stroke-width: 2.5;
        }

        /* 空状态 */
        .empty-state {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 24px;
            text-align: center;
        }

        .empty-state.show {
            display: flex;
        }

        .empty-icon {
            width: 100px;
            height: 100px;
            background: #F5F5F5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        .empty-icon img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            opacity: 0.4;
        }

        .empty-title {
            font-size: 20px;
            font-weight: 600;
            color: #000;
            margin-bottom: 10px;
        }

        .empty-subtitle {
            font-size: 15px;
            color: #8E8E93;
            line-height: 1.5;
        }

        /* 底部菜单栏 */
        .bottom-nav {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 22px;
            display: flex;
            justify-content: space-around;
            padding: 10px 8px;
            position: absolute;
            bottom: 25px;
            left: 16px;
            right: 16px;
            height: 70px;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            cursor: pointer;
            transition: all 0.25s ease;
            flex: 1;
        }

        .nav-item:active {
            transform: scale(0.88);
        }

        .nav-icon {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
        }

        .nav-icon svg {
            width: 100%;
            height: 100%;
            stroke: #8E8E93;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.25s ease;
        }

        .nav-item.active .nav-icon svg {
            stroke: #0052CC;
            stroke-width: 2;
        }

        .nav-label {
            font-size: 11px;
            color: #8E8E93;
            font-weight: 500;
            transition: all 0.25s ease;
        }

        .nav-item.active .nav-label {
            color: #0052CC;
            font-weight: 600;
        }

        /* 底部指示条 */
        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 5px;
            background: #000;
            border-radius: 3px;
            opacity: 0.3;
        }

        /* 遮罩层 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 200;
            border-radius: 45px;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* 确认弹窗通用样式 */
        .confirm-alert {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 270px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 14px;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 202;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .confirm-alert.active {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        /* 删除确认弹窗 */
        .delete-alert {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 270px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 14px;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 202;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .delete-alert.active {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .alert-content {
            padding: 19px 16px 20px;
            text-align: center;
        }

        .alert-title {
            font-size: 17px;
            font-weight: 600;
            color: #000;
            margin-bottom: 2px;
            line-height: 1.29412;
            letter-spacing: -0.41px;
        }

        .alert-message {
            font-size: 13px;
            color: #000;
            line-height: 1.23077;
            opacity: 0.6;
            letter-spacing: -0.08px;
        }

        .alert-buttons {
            margin-top: 20px;
            border-top: 0.5px solid rgba(60, 60, 67, 0.18);
            display: flex;
            flex-direction: row;
        }

        .alert-button {
            flex: 1;
            height: 44px;
            background: transparent;
            border: none;
            font-size: 17px;
            color: #0052CC;
            cursor: pointer;
            transition: background 0.15s ease;
            font-weight: 400;
            letter-spacing: -0.4px;
        }

        .alert-button:active {
            background: rgba(0, 0, 0, 0.04);
        }

        .alert-button.delete {
            color: #FF3B30;
            font-weight: 600;
            border-left: 0.5px solid rgba(60, 60, 67, 0.18);
        }

        /* 电流分配图样式 */
        .current-flow-diagram {
            width: 100%;
            padding: 10px 0;
        }

        .current-flow-diagram svg {
            width: 100%;
            height: auto;
        }

        /* 电流标签样式 */
        .current-label {
            font-size: 16px;
            font-weight: 700;
            fill: #0052CC;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
        }

        .total-current-label {
            font-size: 20px;
            font-weight: 700;
            fill: #0052CC;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
        }

        /* 指示灯闪烁动画 */
        .indicator-light {
            animation: blink 2s ease-in-out infinite;
        }

        .indicator-light:nth-child(2) {
            animation-delay: 0.3s;
        }

        .indicator-light:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* 电流流动点样式 */
        .flow-dot {
            filter: drop-shadow(0 0 3px rgba(255, 215, 0, 0.8));
        }

        /* 调试抽屉样式 */
        .debug-drawer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            border-radius: 20px 20px 45px 45px;
            padding: 0;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            z-index: 201;
            max-height: 80%;
            display: flex;
            flex-direction: column;
        }

        .debug-drawer.active {
            transform: translateY(0);
        }

        .debug-drawer .drawer-header {
            padding: 20px 20px 0;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .debug-drawer .drawer-title {
            font-size: 18px;
            font-weight: 600;
            color: #000;
        }

        /* 标签菜单 */
        .debug-tabs {

        // 更新界面语言
        function updateLanguage(lang) {
            const texts = i18n[lang];
            if (!texts) return;

            // 更新页面标题
            document.querySelector('.page-title-text').textContent = texts.pageTitle;

            // 断开连接按钮和搜索按钮都是图标，不需要更新文字

            // 更新空状态
            document.querySelector('.empty-title').textContent = texts.emptyTitle;
            document.querySelector('.empty-subtitle').textContent = texts.emptySubtitle;

            // 更新删除弹窗
            const deleteAlertTitle = document.querySelector('#deleteAlert .alert-title');
            const deleteAlertMessage = document.querySelector('#deleteAlert .alert-message');
            if (deleteAlertTitle) deleteAlertTitle.textContent = texts.deleteTitle;
            if (deleteAlertMessage) deleteAlertMessage.textContent = texts.deleteMessage;
            document.getElementById('cancelDelete').textContent = texts.cancel;
            document.getElementById('confirmDelete').textContent = texts.delete;

            // 更新断开连接弹窗
            const disconnectAlertTitle = document.querySelector('#disconnectAlert .alert-title');
            const disconnectAlertMessage = document.querySelector('#disconnectAlert .alert-message');
            if (disconnectAlertTitle) disconnectAlertTitle.textContent = texts.disconnectTitle;
            if (disconnectAlertMessage) disconnectAlertMessage.textContent = texts.disconnectMessage;
            document.getElementById('cancelDisconnect').textContent = texts.cancel;
            document.getElementById('confirmDisconnect').textContent = texts.confirmDisconnect;

            // 更新导航标签
            const navLabels = document.querySelectorAll('.nav-label');
            navLabels[0].textContent = texts.navChargers;
            navLabels[1].textContent = texts.navRecords;
            navLabels[2].textContent = texts.navDebug;
            navLabels[3].textContent = texts.navMe;

            // 更新入户电流设置卡片
            const gearLabel = document.querySelector('.gear-label');
            const gearHint = document.querySelector('.gear-hint');
            if (gearLabel) gearLabel.textContent = texts.chargingCurrent;
            if (gearHint) gearHint.textContent = texts.currentWarning;

            // 更新入户电流设置确认弹窗按钮
            document.getElementById('confirmCurrentSetting').textContent = texts.confirm;

            // 更新调试抽屉
            updateDebugDrawerLanguage();

            // 重新渲染充电桩列表以更新状态文本
            renderChargerList();
        }

        // 档位电流配置 (A)
        const gearCurrents = {
            1: 20,
            2: 25,
            3: 32,
            4: 40,
            5: 50,
            6: 63
        };

        // 当前档位
        let currentGear = 3; // 默认3档
        let pendingGear = null; // 待设置的档位

        // 选择档位 - 显示确认弹窗
        function selectGear(gear) {
            // 如果点击的是当前已选中的档位，不需要确认
            if (gear === currentGear) {
                return;
            }

            // 保存待设置的档位
            pendingGear = gear;
            const currentValue = gearCurrents[gear];

            // 获取当前语言
            const savedLanguage = localStorage.getItem('preferredLanguage') || 'English';
            const texts = i18n[savedLanguage];

            // 更新弹窗标题和消息
            const alertTitle = document.querySelector('#currentSettingAlert .alert-title');
            const alertMessage = document.querySelector('#currentSettingAlert .alert-message');

            alertTitle.innerHTML = `${texts.currentSettingTitle} <span id="confirmCurrentValue" style="color: #0052CC; font-weight: 600;">${currentValue}</span>A？`;
            alertMessage.textContent = texts.currentSettingMessage;

            // 显示确认弹窗
            document.getElementById('overlay').classList.add('active');
            document.getElementById('currentSettingAlert').classList.add('active');
        }

        // 确认设置电流
        function confirmCurrentSetting() {
            if (pendingGear === null) return;

            currentGear = pendingGear;

            // 更新UI
            document.querySelectorAll('.gear-option').forEach(option => {
                option.classList.remove('selected');
            });
            document.querySelector(`.gear-option[data-gear="${currentGear}"]`).classList.add('selected');

            // 保存设置到 localStorage
            const currentValue = gearCurrents[currentGear];
            localStorage.setItem('incomingCurrent', currentValue);

            console.log('切换到档位:', currentGear, '电流:', currentValue, 'A');

            // 关闭弹窗
            closeCurrentSettingAlert();
        }

        // 取消设置电流
        function cancelCurrentSetting() {
            pendingGear = null;
            closeCurrentSettingAlert();
        }

        // 关闭电流设置弹窗
        function closeCurrentSettingAlert() {
            document.getElementById('overlay').classList.remove('active');
            document.getElementById('currentSettingAlert').classList.remove('active');
        }

        // 获取或初始化入户电流设置
        function getIncomingCurrent() {
            const saved = localStorage.getItem('incomingCurrent');
            return saved ? parseInt(saved) : 32; // 默认32A
        }

        // 保存入户电流设置
        function saveIncomingCurrent(value) {
            localStorage.setItem('incomingCurrent', value);
        }

        // 初始化入户电流选择器
        function initCurrentSelector() {
            const savedCurrent = getIncomingCurrent();

            // 根据保存的电流值找到对应的档位
            let initialGear = 3; // 默认档位3 (32A)
            for (let gear in gearCurrents) {
                if (gearCurrents[gear] === savedCurrent) {
                    initialGear = parseInt(gear);
                    break;
                }
            }

            currentGear = initialGear;

            // 设置初始选中状态
            document.querySelectorAll('.gear-option').forEach(option => {
                const gear = parseInt(option.dataset.gear);
                if (gear === currentGear) {
                    option.classList.add('selected');
                } else {
                    option.classList.remove('selected');
                }
            });
        }

        // 更新系统信息（保留函数但不再更新DOM，避免调用处报错）
        function updateSystemInfo() {
            // 系统信息区域已删除，此函数保留为空
        }

        // 获取当前正在充电的设备ID
        function getChargingDeviceId() {
            const chargingStatusStr = localStorage.getItem('chargingStatus');
            if (!chargingStatusStr) return null;

            try {
                const chargingData = JSON.parse(chargingStatusStr);
                if (chargingData.isCharging && chargingData.deviceID) {
                    return chargingData.deviceID;
                }
            } catch (error) {
                console.error('解析充电状态失败:', error);
            }
            return null;
        }

        // 获取已保存的充电桩数据
        function getSavedChargers() {
            const saved = localStorage.getItem('savedChargers');
            const chargers = saved ? JSON.parse(saved) : [
                { id: '3847291650', name: '3847291650', deviceStatus: 'online', usageStatus: 'idle' },
                { id: '5629384710', name: '5629384710', deviceStatus: 'online', usageStatus: 'busy', gear: 3 }
            ];

            // 同步充电状态：检查是否有设备正在充电
            const chargingStatusStr = localStorage.getItem('chargingStatus');
            let chargingData = null;
            if (chargingStatusStr) {
                try {
                    chargingData = JSON.parse(chargingStatusStr);
                } catch (error) {
                    console.error('解析充电状态失败:', error);
                }
            }

            chargers.forEach(charger => {
                if (chargingData && chargingData.isCharging && charger.id === chargingData.deviceID) {
                    // 如果 chargingStatus 中有这个设备，更新为 busy 状态
                    charger.usageStatus = 'busy';
                    charger.gear = chargingData.gear || 3;
                }
                // 注意：移除了自动将 busy 设备重置为 idle 的逻辑
                // 设备的 busy/idle 状态由用户操作（连接/断开）来控制
            });

            return chargers;
        }

        // 保存充电桩数据
        function saveChargers(chargers) {
            localStorage.setItem('savedChargers', JSON.stringify(chargers));
        }

        let savedChargers = getSavedChargers();

        // 页面元素
        const chargerList = document.getElementById('chargerList');
        const emptyState = document.getElementById('emptyState');
        const titleSearchBtn = document.getElementById('titleSearchBtn');
        const overlay = document.getElementById('overlay');
        const deleteAlert = document.getElementById('deleteAlert');
        const cancelDelete = document.getElementById('cancelDelete');
        const confirmDelete = document.getElementById('confirmDelete');

        let chargerToDelete = null;

        // 渲染充电桩列表
        function renderChargerList() {
            const savedLanguage = localStorage.getItem('preferredLanguage') || 'English';
            const texts = i18n[savedLanguage];

            chargerList.innerHTML = '';

            // 检查是否有设备正在使用中
            const hasBusyDevice = savedChargers.some(c => c.usageStatus === 'busy');
            const titleDisconnectBtn = document.getElementById('titleDisconnectBtn');
            if (hasBusyDevice) {
                titleDisconnectBtn.classList.add('show');
            } else {
                titleDisconnectBtn.classList.remove('show');
            }

            if (savedChargers.length === 0) {
                emptyState.classList.add('show');
            } else {
                emptyState.classList.remove('show');

                savedChargers.forEach(charger => {
                    // 创建包装器
                    const wrapper = document.createElement('div');
                    wrapper.className = 'charger-card-wrapper';
                    wrapper.dataset.id = charger.id;

                    // 构建状态HTML
                    let statusHTML = '';
                    const isOffline = charger.deviceStatus === 'offline';

                    if (isOffline) {
                        // 离线状态
                        statusHTML = `
                            <div class="status-row device-status">
                                <div class="status-dot offline"></div>
                                <span>${texts.offline}</span>
                            </div>
                        `;
                    } else {
                        // 在线状态
                        const deviceStatusHTML = `
                            <div class="status-row device-status">
                                <div class="status-dot"></div>
                                <span>${texts.online}</span>
                            </div>
                        `;

                        // 使用状态
                        let usageStatusHTML = '';
                        if (charger.usageStatus === 'busy') {
                            usageStatusHTML = `
                                <div class="usage-status">${texts.busy}</div>
                            `;
                        }

                        // 电流显示 - 独立一行
                        // 使用中显示12A（充电桩电流24A的1/2），空闲显示--
                        const currentValue = charger.usageStatus === 'busy' ? '12A' : '--';
                        const currentHTML = `
                            <div class="charger-current">
                                <span class="charger-current-label">${texts.current}:</span>
                                <span>${currentValue}</span>
                            </div>
                        `;

                        statusHTML = deviceStatusHTML + usageStatusHTML + currentHTML;
                    }

                    // 只有在线设备才显示删除按钮
                    const deleteButtonHTML = !isOffline ? `
                        <div class="swipe-delete-btn" data-id="${charger.id}">
                            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                            </svg>
                        </div>
                    ` : '';

                    // 所有设备右侧统一显示箭头
                    const rightButtonHTML = `<div class="enter-arrow">
                            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 18l6-6-6-6"/>
                            </svg>
                        </div>`;

                    wrapper.innerHTML = `
                        ${deleteButtonHTML}
                        <div class="charger-card" data-id="${charger.id}">
                            <div class="charger-icon">
                                <img src="充电.png" alt="充电桩">
                            </div>
                            <div class="charger-info">
                                <div class="charger-name">${charger.name}</div>
                                <div class="charger-version">V1.0</div>
                                <div class="charger-status">
                                    ${statusHTML}
                                </div>
                            </div>
                            ${rightButtonHTML}
                        </div>
                    `;

                    const card = wrapper.querySelector('.charger-card');
                    const deleteBtn = wrapper.querySelector('.swipe-delete-btn');

                    // 只有在线设备才启用左滑删除
                    if (!isOffline) {
                        // 左滑手势变量
                        let touchStartX = 0;
                        let touchCurrentX = 0;
                        let isSwiping = false;

                        // 触摸开始
                        card.addEventListener('touchstart', function(e) {
                            touchStartX = e.touches[0].clientX;
                            isSwiping = true;
                        });

                        // 触摸移动
                        card.addEventListener('touchmove', function(e) {
                            if (!isSwiping) return;

                            touchCurrentX = e.touches[0].clientX;
                            const diff = touchStartX - touchCurrentX;

                            // 只允许左滑
                            if (diff > 0 && diff <= 80) {
                                card.style.transform = `translateX(-${diff}px)`;
                            }
                        });

                        // 触摸结束
                        card.addEventListener('touchend', function(e) {
                            if (!isSwiping) return;
                            isSwiping = false;

                            const diff = touchStartX - touchCurrentX;

                            // 如果滑动超过40px，显示删除按钮
                            if (diff > 40) {
                                card.style.transform = 'translateX(-80px)';
                            } else {
                                card.style.transform = 'translateX(0)';
                            }
                        });

                        // 点击卡片进入详情
                        card.addEventListener('click', function() {
                            // 如果卡片已经左滑，点击时先恢复
                            if (card.style.transform === 'translateX(-80px)') {
                                card.style.transform = 'translateX(0)';
                            } else {
                                // 如果设备正在使用中，确保充电状态存在(但不覆盖已有状态)
                                if (charger.usageStatus === 'busy') {
                                    // 检查是否已经存在充电状态
                                    const existingStatusStr = localStorage.getItem('chargingStatus');
                                    let needsUpdate = true;

                                    if (existingStatusStr) {
                                        try {
                                            const existingStatus = JSON.parse(existingStatusStr);
                                            // 如果已经有这个设备的充电状态，不要修改它(保留原始开始时间)
                                            if (existingStatus.deviceID === charger.id && existingStatus.isCharging) {
                                                needsUpdate = false;
                                                console.log('设备已在充电中，保留现有充电状态');
                                            }
                                        } catch (error) {
                                            console.error('解析现有充电状态失败:', error);
                                        }
                                    }

                                    // 只有在不存在充电状态时才创建新的
                                    if (needsUpdate) {
                                        console.log('创建新的充电状态');
                                        const chargingStatus = {
                                            isCharging: true,
                                            deviceID: charger.id,
                                            gear: charger.gear || 3,
                                            startTime: new Date().toISOString()
                                        };
                                        localStorage.setItem('chargingStatus', JSON.stringify(chargingStatus));
                                    }
                                }
                                window.location.href = `device-detail.html?id=${charger.id}`;
                            }
                        });

                        // 删除按钮事件
                        deleteBtn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            chargerToDelete = charger.id;
                            overlay.classList.add('active');
                            deleteAlert.classList.add('active');
                            // 恢复卡片位置
                            card.style.transform = 'translateX(0)';
                        });
                    } else {
                        // 离线设备直接点击进入详情
                        card.addEventListener('click', function() {
                            window.location.href = `device-detail.html?id=${charger.id}`;
                        });
                    }

                    chargerList.appendChild(wrapper);
                });
            }
        }

        // 标题搜索按钮 - 跳转到充电桩搜索页面
        titleSearchBtn.addEventListener('click', function() {
            window.location.href = 'charger-gun-finder.html';
        });

        // 标题断开连接按钮 - 显示确认弹窗
        const titleDisconnectBtn = document.getElementById('titleDisconnectBtn');
        titleDisconnectBtn.addEventListener('click', function() {
            overlay.classList.add('active');
            document.getElementById('disconnectAlert').classList.add('active');
        });

        // 取消删除
        cancelDelete.addEventListener('click', function() {
            overlay.classList.remove('active');
            deleteAlert.classList.remove('active');
            chargerToDelete = null;
        });

        // 确认删除
        confirmDelete.addEventListener('click', function() {
            if (chargerToDelete) {
                savedChargers = savedChargers.filter(c => c.id !== chargerToDelete);
                saveChargers(savedChargers);
                renderChargerList();
            }

            overlay.classList.remove('active');
            deleteAlert.classList.remove('active');
            chargerToDelete = null;
        });

        // 取消断开连接
        document.getElementById('cancelDisconnect').addEventListener('click', function() {
            overlay.classList.remove('active');
            document.getElementById('disconnectAlert').classList.remove('active');
        });

        // 确认断开连接
        document.getElementById('confirmDisconnect').addEventListener('click', function() {
            // 先获取正在充电的设备ID
            const chargingDeviceId = getChargingDeviceId();

            // 清除充电状态
            localStorage.removeItem('chargingStatus');

            // 更新设备状态为空闲
            if (chargingDeviceId) {
                const chargerIndex = savedChargers.findIndex(c => c.id === chargingDeviceId);
                if (chargerIndex !== -1) {
                    savedChargers[chargerIndex].usageStatus = 'idle';
                    delete savedChargers[chargerIndex].gear;
                    saveChargers(savedChargers);
                }
            }

            // 关闭弹窗
            overlay.classList.remove('active');
            document.getElementById('disconnectAlert').classList.remove('active');

            // 返回设备页面
            window.location.href = 'home.html';
        });

        // 入户电流设置确认按钮
        document.getElementById('confirmCurrentSetting').addEventListener('click', function() {
            confirmCurrentSetting();
        });

        // 入户电流设置取消按钮
        document.getElementById('cancelCurrentSetting').addEventListener('click', function() {
            cancelCurrentSetting();
        });

        // 底部导航
        function navigateTo(page) {
            if (page === 'record') {
                window.location.href = 'records.html';
            } else if (page === 'debug') {
                window.location.href = 'debug.html';
            } else if (page === 'me') {
                window.location.href = 'profile-3menu.html';
            }
        }

        // 监听充电状态变化
        window.addEventListener('storage', function(e) {
            if (e.key === 'chargingStatus') {
                // 充电状态改变，重新渲染列表
                savedChargers = getSavedChargers();
                renderChargerList();
            }
        });

        // 页面可见性变化时重新加载数据
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                savedChargers = getSavedChargers();
                renderChargerList();
            }
        });

        // 定期同步充电状态（每秒检查一次）
        setInterval(function() {
            const currentChargers = getSavedChargers();
            // 检查是否有状态变化
            let hasChange = false;
            for (let i = 0; i < currentChargers.length; i++) {
                if (savedChargers[i] && currentChargers[i].usageStatus !== savedChargers[i].usageStatus) {
                    hasChange = true;
                    break;
                }
            }
            if (hasChange) {
                savedChargers = currentChargers;
                renderChargerList();
            }
        }, 1000);

        // 页面加载时恢复语言设置
        const savedLanguage = localStorage.getItem('preferredLanguage') || 'English';
        updateLanguage(savedLanguage); // 无论什么语言都更新一次，确保菜单栏正确翻译

        // 调试函数：查看当前数据状态
        window.debugChargers = function() {
            console.log('=== 当前充电桩数据 ===');
            console.log(JSON.stringify(savedChargers, null, 2));
            console.log('=== localStorage 数据 ===');
            console.log(localStorage.getItem('savedChargers'));

            // 强制刷新显示
            savedChargers = getSavedChargers();
            renderChargerList();

            alert('数据已刷新，请查看控制台输出');
        };

        // ====== 调试功能 ======

        // 调试抽屉相关元素
        const debugNavItem = document.getElementById('debugNavItem');
        const debugDrawer = document.getElementById('debugDrawer');
        const debugDrawerClose = document.getElementById('debugDrawerClose');
        const meterRefreshBtn = document.getElementById('meterRefreshBtn');
        const saveMeterParams = document.getElementById('saveMeterParams');

        // 打开调试抽屉
        debugNavItem.addEventListener('click', function() {
            debugDrawer.classList.add('active');
            overlay.classList.add('active');
            loadMeterParams();
            renderDebugDevices();

            // 初始化标签切换
            initDebugTabs();
        });

        // 关闭调试抽屉
        function closeDebugDrawer() {
            debugDrawer.classList.remove('active');
            overlay.classList.remove('active');
        }

        debugDrawerClose.addEventListener('click', closeDebugDrawer);

        // 修改overlay点击事件，添加关闭调试抽屉
        overlay.addEventListener('click', function() {
            overlay.classList.remove('active');
            deleteAlert.classList.remove('active');
            document.getElementById('disconnectAlert').classList.remove('active');
            document.getElementById('currentSettingAlert').classList.remove('active');
            debugDrawer.classList.remove('active');
            chargerToDelete = null;
            pendingGear = null;
        });

        // 加载电表参数
        function loadMeterParams() {
            const savedParams = localStorage.getItem('meterParams');
            if (savedParams) {
                const params = JSON.parse(savedParams);
                document.getElementById('voltageCoef').value = params.voltage || 1.0;
                document.getElementById('currentCoef').value = params.current || 1.0;
                document.getElementById('powerCoef').value = params.power || 1.0;
                document.getElementById('energyCoef').value = params.energy || 1.0;
                document.getElementById('frequencyCoef').value = params.frequency || 1.0;
            }
        }

        // 刷新电表参数
        meterRefreshBtn.addEventListener('click', function() {
            loadMeterParams();
            // 添加旋转动画
            meterRefreshBtn.style.transform = 'scale(0.9) rotate(180deg)';
            setTimeout(() => {
                meterRefreshBtn.style.transform = '';
            }, 200);
        });

        // 保存电表参数
        saveMeterParams.addEventListener('click', function() {
            const params = {
                voltage: parseFloat(document.getElementById('voltageCoef').value),
                current: parseFloat(document.getElementById('currentCoef').value),
                power: parseFloat(document.getElementById('powerCoef').value),
                energy: parseFloat(document.getElementById('energyCoef').value),
                frequency: parseFloat(document.getElementById('frequencyCoef').value)
            };
            localStorage.setItem('meterParams', JSON.stringify(params));

            // 显示保存成功提示
            const savedLanguage = localStorage.getItem('preferredLanguage') || 'English';
            const texts = i18n[savedLanguage];
            alert(texts.paramsSaved);
        });

        // 渲染设备信息卡片
        function renderDebugDevices() {
            const savedLanguage = localStorage.getItem('preferredLanguage') || 'English';
            const texts = i18n[savedLanguage];
            const deviceCards = document.getElementById('deviceCards');
            deviceCards.innerHTML = '';

            if (savedChargers.length === 0) {
                deviceCards.innerHTML = `<p style="text-align: center; color: #8E8E93; padding: 20px;">${texts.emptyTitle}</p>`;
                return;
            }

            savedChargers.forEach(charger => {
                const isOnline = charger.deviceStatus === 'online';
                const isBusy = charger.usageStatus === 'busy';

                // 生成MAC地址（模拟）
                const macAddress = 'AA:BB:CC:' + charger.id.substring(0, 2) + ':' + charger.id.substring(2, 4) + ':' + charger.id.substring(4, 6);

                // 限制电流（固定为16A）
                const maxCurrent = '16A';

                // 实际电流（使用中显示12A，空闲显示0A）
                const actualCurrent = isBusy ? '12A' : '0A';

                // 状态显示
                const statusText = isOnline ? texts.online : texts.offline;
                const statusDotClass = isOnline ? '' : 'offline';

                const card = document.createElement('div');
                card.className = 'debug-device-card';
                card.innerHTML = `
                    <div class="debug-device-header">
                        <div class="debug-device-name">
                            ${charger.name}
                            ${isBusy ? `<span class="debug-usage-badge">${texts.busy}</span>` : ''}
                        </div>
                        <div class="debug-device-status">
                            <div class="debug-status-dot ${statusDotClass}"></div>
                            <span class="debug-status-text">${statusText}</span>
                        </div>
                    </div>
                    <div class="debug-device-info">
                        <div class="debug-info-row">
                            <span class="debug-info-label">${texts.macAddress}</span>
                            <span class="debug-info-value">${macAddress}</span>
                        </div>
                        <div class="debug-info-row">
                            <span class="debug-info-label">${texts.maxCurrent}</span>
                            <span class="debug-info-value">${maxCurrent}</span>
                        </div>
                        <div class="debug-info-row">
                            <span class="debug-info-label">${texts.actualCurrent}</span>
                            <span class="debug-info-value ${isBusy ? 'charging' : ''}">${actualCurrent}</span>
                        </div>
                        ${isBusy ? `
                        <div class="debug-info-row">
                            <span class="debug-info-label">${texts.status}</span>
                            <span class="debug-info-value charging">${texts.charging}</span>
                        </div>
                        ` : ''}
                    </div>
                `;
                deviceCards.appendChild(card);
            });
        }

        // 初始化标签切换
        function initDebugTabs() {
            const tabs = document.querySelectorAll('.debug-tab');
            const panels = document.querySelectorAll('.debug-panel');

            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    const targetTab = this.getAttribute('data-tab');

                    // 移除所有active状态
                    tabs.forEach(t => t.classList.remove('active'));
                    panels.forEach(p => p.classList.remove('active'));

                    // 添加当前active状态
                    this.classList.add('active');
                    const targetPanel = document.getElementById(targetTab + 'Panel');
                    if (targetPanel) {
                        targetPanel.classList.add('active');
                    }

                    // 如果切换到设备信息标签，重新渲染设备列表
                    if (targetTab === 'device') {
                        renderDebugDevices();
                    }
                });
            });
        }

        // 更新调试抽屉语言
        function updateDebugDrawerLanguage() {
            const debugDrawer = document.getElementById('debugDrawer');
            if (!debugDrawer) return; // 如果抽屉还未初始化，直接返回

            const savedLanguage = localStorage.getItem('preferredLanguage') || 'English';
            const texts = i18n[savedLanguage];

            // 更新抽屉标题
            const debugDrawerTitle = debugDrawer.querySelector('.drawer-title');
            if (debugDrawerTitle) debugDrawerTitle.textContent = texts.debugTitle;

            // 更新标签文本
            const debugTabs = debugDrawer.querySelectorAll('.debug-tab');
            if (debugTabs[0]) debugTabs[0].textContent = texts.meterParams;
            if (debugTabs[1]) debugTabs[1].textContent = texts.deviceInfo;

            // 更新参数标签
            const paramLabels = debugDrawer.querySelectorAll('.param-label');
            if (paramLabels[0]) paramLabels[0].textContent = texts.voltageCoef;
            if (paramLabels[1]) paramLabels[1].textContent = texts.currentCoef;
            if (paramLabels[2]) paramLabels[2].textContent = texts.powerCoef;
            if (paramLabels[3]) paramLabels[3].textContent = texts.energyCoef;
            if (paramLabels[4]) paramLabels[4].textContent = texts.frequencyCoef;

            // 更新保存按钮
            const saveBtn = document.getElementById('saveMeterParams');
            if (saveBtn) saveBtn.textContent = texts.saveParams;

            // 重新渲染设备卡片
            if (debugDrawer.classList.contains('active')) {
                const deviceCardsContainer = document.getElementById('deviceCards');
                if (deviceCardsContainer) {
                    renderDebugDevices();
                }
            }
        }

        // 初始化页面
        console.log('页面初始化，当前设备列表：', savedChargers);
        initCurrentSelector(); // 初始化入户电流选择器
        renderChargerList();
    </script>
</body>
</html>
