<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备信息 - 移动充电</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* iPhone 外框 */
        .iphone-frame {
            width: 393px;
            height: 852px;
            background: #1a1a1a;
            border-radius: 55px;
            padding: 12px;
            box-shadow:
                0 0 0 2px #2a2a2a,
                0 0 0 8px #1a1a1a,
                0 30px 80px rgba(0, 0, 0, 0.5);
            position: relative;
            transform: scale(1.1);
        }

        @media (max-height: 1000px) { .iphone-frame { transform: scale(0.95); } }
        @media (max-height: 900px) { .iphone-frame { transform: scale(0.85); } }
        @media (max-height: 800px) { .iphone-frame { transform: scale(0.75); } }

        /* 灵动岛 */
        .dynamic-island {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 126px;
            height: 37px;
            background: #000;
            border-radius: 22px;
            z-index: 10;
        }

        /* 屏幕内容 */
        .screen {
            width: 100%;
            height: 100%;
            background: #F5F5F5;
            border-radius: 45px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* 状态栏 */
        .status-bar {
            height: 54px;
            background: transparent;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0 20px;
            padding-top: 16px;
            font-size: 15px;
            font-weight: 600;
            color: #000;
        }

        .time {
            font-weight: 600;
            position: absolute;
            left: 35px;
            top: 18px;
        }

        .status-icons {
            display: flex;
            gap: 6px;
            align-items: center;
            position: absolute;
            right: 35px;
            top: 18px;
        }

        /* 信号图标 */
        .signal {
            display: flex;
            gap: 1px;
            align-items: flex-end;
            height: 12px;
        }

        .signal-bar {
            width: 3px;
            background: #000;
            border-radius: 1px;
        }

        .signal-bar:nth-child(1) { height: 4px; }
        .signal-bar:nth-child(2) { height: 6px; }
        .signal-bar:nth-child(3) { height: 8px; }
        .signal-bar:nth-child(4) { height: 10px; }

        /* WiFi 图标 */
        .wifi {
            width: 15px;
            height: 11px;
            position: relative;
        }

        .wifi::before {
            content: '◗';
            font-size: 15px;
            color: #000;
            transform: rotate(45deg);
            display: block;
        }

        /* 电池图标 */
        .battery {
            width: 24px;
            height: 11px;
            border: 1.5px solid #000;
            border-radius: 3px;
            position: relative;
            margin-left: 5px;
            display: flex;
            align-items: center;
            padding: 2px;
        }

        .battery::before {
            content: '';
            position: absolute;
            right: -3px;
            top: 50%;
            transform: translateY(-50%);
            width: 1.5px;
            height: 4px;
            background: #000;
            border-radius: 0 1px 1px 0;
        }

        .battery::after {
            content: '';
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 1px;
        }

        /* 主内容区 */
        .main-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0 16px 110px 16px;
            -webkit-overflow-scrolling: touch;
        }

        /* 隐藏滚动条 */
        .main-content::-webkit-scrollbar {
            display: none;
        }

        .main-content {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 顶部导航栏 */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding: 8px 0;
            margin-left: -8px;
            margin-right: -8px;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            background: transparent;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 0;
            margin: 0;
        }

        .back-btn:active {
            transform: scale(0.9);
            opacity: 0.6;
        }

        .back-btn svg {
            width: 24px;
            height: 24px;
            stroke: #000;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .page-title {
            font-size: 17px;
            font-weight: 600;
            color: #000;
            flex: 1;
            text-align: center;
        }

        /* 设备卡片 */
        .device-cards {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 8px;
        }

        .device-card {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .device-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid #E5E5EA;
        }

        .device-name-row {
            display: flex;
            align-items: center;
        }

        .device-name {
            font-size: 18px;
            font-weight: 600;
            color: #000;
        }

        .device-status-group {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
        }

        .device-status {
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
        }

        .device-status.online {
            background: #E8F5E9;
            color: #2E7D32;
        }

        .device-status.offline {
            background: #FFEBEE;
            color: #C62828;
        }

        .usage-status {
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            background: #FFF3E0;
            color: #E65100;
        }

        .device-info-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .device-info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-label {
            font-size: 15px;
            color: #8E8E93;
        }

        .info-value {
            font-size: 15px;
            color: #000;
            font-weight: 500;
        }

        .charging-badge {
            padding: 5px 14px;
            background: #E3F2FD;
            color: #1976D2;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
        }

        /* 空状态 */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
        }

        .empty-icon {
            width: 80px;
            height: 80px;
            background: #F2F2F7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .empty-icon svg {
            width: 40px;
            height: 40px;
            stroke: #C7C7CC;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .empty-text {
            font-size: 16px;
            color: #8E8E93;
            margin-bottom: 8px;
        }

        .empty-subtext {
            font-size: 14px;
            color: #C7C7CC;
        }

        /* 底部菜单栏 */
        .bottom-nav {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 22px;
            display: flex;
            justify-content: space-around;
            padding: 10px 16px;
            position: absolute;
            bottom: 25px;
            left: 16px;
            right: 16px;
            height: 70px;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            cursor: pointer;
            transition: all 0.25s ease;
            flex: 1;
        }

        .nav-item:active {
            transform: scale(0.88);
        }

        .nav-icon {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
        }

        .nav-icon svg {
            width: 100%;
            height: 100%;
            stroke: #8E8E93;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.25s ease;
        }

        .nav-item.active .nav-icon svg {
            stroke: #0052CC;
            stroke-width: 2;
        }

        .nav-label {
            font-size: 11px;
            color: #8E8E93;
            font-weight: 500;
            transition: all 0.25s ease;
        }

        .nav-item.active .nav-label {
            color: #0052CC;
            font-weight: 600;
        }

        /* 底部指示条 */
        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 5px;
            background: #000;
            border-radius: 3px;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="iphone-frame">
        <!-- 灵动岛 -->
        <div class="dynamic-island"></div>

        <!-- 屏幕内容 -->
        <div class="screen">
            <!-- 状态栏 -->
            <div class="status-bar">
                <div class="time">9:41</div>
                <div class="status-icons">
                    <div class="signal">
                        <div class="signal-bar"></div>
                        <div class="signal-bar"></div>
                        <div class="signal-bar"></div>
                        <div class="signal-bar"></div>
                    </div>
                    <div class="wifi"></div>
                    <div class="battery"></div>
                </div>
            </div>

            <!-- 主内容区 -->
            <div class="main-content">
                <!-- 顶部导航栏 -->
                <div class="page-header">
                    <button class="back-btn" onclick="goBack()">
                        <svg viewBox="0 0 24 24">
                            <path d="M15 18l-6-6 6-6"/>
                        </svg>
                    </button>
                    <div class="page-title">设备信息</div>
                    <div style="width: 36px;"></div>
                </div>

                <!-- 设备卡片列表 -->
                <div class="device-cards" id="deviceCards">
                    <!-- 设备卡片将通过JavaScript动态生成 -->
                </div>
            </div>

            <!-- 底部菜单栏 -->
            <div class="bottom-nav">
                <div class="nav-item" onclick="navigateTo('search')">
                    <div class="nav-icon">
                        <svg viewBox="0 0 24 24">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="m21 21-4.35-4.35"/>
                        </svg>
                    </div>
                    <div class="nav-label">充电桩</div>
                </div>
                <div class="nav-item" onclick="navigateTo('record')">
                    <div class="nav-icon">
                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                    </div>
                    <div class="nav-label">记录</div>
                </div>
                <div class="nav-item active">
                    <div class="nav-icon">
                        <svg viewBox="0 0 24 24">
                            <rect x="3" y="8" width="18" height="12" rx="2"/>
                            <path d="M7 8V6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2"/>
                            <line x1="12" y1="11" x2="12" y2="17"/>
                            <line x1="9" y1="14" x2="15" y2="14"/>
                        </svg>
                    </div>
                    <div class="nav-label">调试</div>
                </div>
                <div class="nav-item" onclick="navigateTo('me')">
                    <div class="nav-icon">
                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="8" r="5"/>
                            <path d="M3 21v-2a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v2"/>
                        </svg>
                    </div>
                    <div class="nav-label">我的</div>
                </div>
            </div>

            <!-- 底部指示条 -->
            <div class="home-indicator"></div>
        </div>
    </div>

    <script>
        // 多语言配置
        const i18n = {
            '中文': {
                pageTitle: '设备信息',
                deviceName: '设备名称',
                devicePrefix: '设备',
                online: '在线',
                offline: '离线',
                inUse: '使用中',
                deviceSN: '设备SN',
                macAddress: 'MAC地址',
                maxCurrent: '限制电流',
                actualCurrent: '实际电流',
                status: '状态',
                charging: '充电中',
                noDevices: '暂无设备',
                noDevicesSubtext: '请先保存充电桩设备',
                navSearch: '充电桩',
                navRecord: '记录',
                navDebug: '调试',
                navMe: '我的'
            },
            '繁體中文': {
                pageTitle: '設備信息',
                deviceName: '設備名稱',
                devicePrefix: '設備',
                online: '在線',
                offline: '離線',
                inUse: '使用中',
                deviceSN: '設備SN',
                macAddress: 'MAC地址',
                maxCurrent: '限制電流',
                actualCurrent: '實際電流',
                status: '狀態',
                charging: '充電中',
                noDevices: '暫無設備',
                noDevicesSubtext: '請先保存充電樁設備',
                navSearch: '充電樁',
                navRecord: '記錄',
                navDebug: '調試',
                navMe: '我的'
            },
            'English': {
                pageTitle: 'Device Information',
                deviceName: 'Device Name',
                devicePrefix: 'Device',
                online: 'Online',
                offline: 'Offline',
                inUse: 'In Use',
                deviceSN: 'Device SN',
                macAddress: 'MAC Address',
                maxCurrent: 'Max Current',
                actualCurrent: 'Actual Current',
                status: 'Status',
                charging: 'Charging',
                noDevices: 'No Devices',
                noDevicesSubtext: 'Please save chargers first',
                navSearch: 'Chargers',
                navRecord: 'Records',
                navDebug: 'Debug',
                navMe: 'Me'
            }
        };

        // 更新界面语言
        function updateLanguage(lang) {
            const texts = i18n[lang];
            if (!texts) return;

            document.querySelector('.page-title').textContent = texts.pageTitle;

            const navLabels = document.querySelectorAll('.nav-label');
            navLabels[0].textContent = texts.navSearch;
            navLabels[1].textContent = texts.navRecord;
            navLabels[2].textContent = texts.navDebug;
            navLabels[3].textContent = texts.navMe;

            // 重新渲染设备列表以更新语言
            renderDevices();
        }

        // 渲染设备信息
        function renderDevices() {
            const savedLanguage = localStorage.getItem('preferredLanguage') || 'English';
            const texts = i18n[savedLanguage];
            const deviceCards = document.getElementById('deviceCards');
            const savedChargers = JSON.parse(localStorage.getItem('savedChargers') || '[]');

            if (savedChargers.length === 0) {
                deviceCards.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">
                            <svg viewBox="0 0 24 24">
                                <rect x="3" y="8" width="18" height="12" rx="2"/>
                                <path d="M7 8V6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2"/>
                                <line x1="12" y1="11" x2="12" y2="17"/>
                                <line x1="9" y1="14" x2="15" y2="14"/>
                            </svg>
                        </div>
                        <div class="empty-text">${texts.noDevices}</div>
                        <div class="empty-subtext">${texts.noDevicesSubtext}</div>
                    </div>
                `;
                return;
            }

            deviceCards.innerHTML = savedChargers.map((charger, index) => {
                const isOnline = Math.random() > 0.3;
                const isInUse = isOnline && Math.random() > 0.5;
                const isCharging = isInUse && Math.random() > 0.3;
                const maxCurrent = 32;
                const actualCurrent = isCharging ? (Math.random() * maxCurrent).toFixed(1) : 0;
                const macAddress = `AA:BB:CC:DD:EE:${index.toString(16).padStart(2, '0').toUpperCase()}`;

                return `
                    <div class="device-card">
                        <div class="device-header">
                            <div class="device-name-row">
                                <div class="device-name">${charger.name && charger.name !== charger.id ? charger.name : texts.devicePrefix + (index + 1)}</div>
                            </div>
                            <div class="device-status-group">
                                <div class="device-status ${isOnline ? 'online' : 'offline'}">
                                    ${isOnline ? texts.online : texts.offline}
                                </div>
                                ${isInUse ? `<div class="usage-status">${texts.inUse}</div>` : ''}
                            </div>
                        </div>
                        <div class="device-info-list">
                            <div class="device-info-item">
                                <span class="info-label">${texts.deviceSN}</span>
                                <span class="info-value">${charger.id}</span>
                            </div>
                            <div class="device-info-item">
                                <span class="info-label">${texts.macAddress}</span>
                                <span class="info-value">${macAddress}</span>
                            </div>
                            <div class="device-info-item">
                                <span class="info-label">${texts.maxCurrent}</span>
                                <span class="info-value">${maxCurrent}A</span>
                            </div>
                            <div class="device-info-item">
                                <span class="info-label">${texts.actualCurrent}</span>
                                <span class="info-value">${actualCurrent}A</span>
                            </div>
                            <div class="device-info-item">
                                <span class="info-label">${texts.status}</span>
                                ${isCharging ? `<span class="charging-badge">${texts.charging}</span>` : '<span class="info-value">-</span>'}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 返回上一页
        function goBack() {
            window.location.href = 'debug.html';
        }

        // 底部导航跳转函数
        function navigateTo(page) {
            if (page === 'search') {
                window.location.href = 'search.html';
            } else if (page === 'record') {
                window.location.href = 'records.html';
            } else if (page === 'me') {
                window.location.href = 'profile-3menu.html';
            }
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 恢复语言设置
            const savedLanguage = localStorage.getItem('preferredLanguage') || 'English';
            updateLanguage(savedLanguage);
        });
    </script>
</body>
</html>
