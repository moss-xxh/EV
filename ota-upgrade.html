<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTA升级 - 移动充电</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* iPhone 外框 */
        .iphone-frame {
            width: 393px;
            height: 852px;
            background: #1a1a1a;
            border-radius: 55px;
            padding: 12px;
            box-shadow:
                0 0 0 2px #2a2a2a,
                0 0 0 8px #1a1a1a,
                0 30px 80px rgba(0, 0, 0, 0.5);
            position: relative;
            transform: scale(1.1);
        }

        @media (max-height: 1000px) { .iphone-frame { transform: scale(0.95); } }
        @media (max-height: 900px) { .iphone-frame { transform: scale(0.85); } }
        @media (max-height: 800px) { .iphone-frame { transform: scale(0.75); } }

        /* 灵动岛 */
        .dynamic-island {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 126px;
            height: 37px;
            background: #000;
            border-radius: 22px;
            z-index: 10;
        }

        /* 屏幕内容 */
        .screen {
            width: 100%;
            height: 100%;
            background: #F5F5F5;
            border-radius: 45px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* 状态栏 */
        .status-bar {
            height: 54px;
            background: transparent;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0 20px;
            padding-top: 16px;
            font-size: 15px;
            font-weight: 600;
            color: #000;
        }

        .time {
            font-weight: 600;
            position: absolute;
            left: 35px;
            top: 18px;
        }

        .status-icons {
            display: flex;
            gap: 6px;
            align-items: center;
            position: absolute;
            right: 35px;
            top: 18px;
        }

        /* 信号图标 */
        .signal {
            display: flex;
            gap: 1px;
            align-items: flex-end;
            height: 12px;
        }

        .signal-bar {
            width: 3px;
            background: #000;
            border-radius: 1px;
        }

        .signal-bar:nth-child(1) { height: 4px; }
        .signal-bar:nth-child(2) { height: 6px; }
        .signal-bar:nth-child(3) { height: 8px; }
        .signal-bar:nth-child(4) { height: 10px; }

        /* WiFi 图标 */
        .wifi {
            width: 15px;
            height: 11px;
            position: relative;
        }

        .wifi::before {
            content: '◗';
            font-size: 15px;
            color: #000;
            transform: rotate(45deg);
            display: block;
        }

        /* 电池图标 */
        .battery {
            width: 24px;
            height: 11px;
            border: 1.5px solid #000;
            border-radius: 3px;
            position: relative;
            margin-left: 5px;
            display: flex;
            align-items: center;
            padding: 2px;
        }

        .battery::before {
            content: '';
            position: absolute;
            right: -3px;
            top: 50%;
            transform: translateY(-50%);
            width: 1.5px;
            height: 4px;
            background: #000;
            border-radius: 0 1px 1px 0;
        }

        .battery::after {
            content: '';
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 1px;
        }

        /* 顶部导航栏 */
        .detail-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding: 8px 0;
            margin-left: -8px;
            margin-right: -8px;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            background: transparent;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 0;
            margin: 0;
        }

        .back-btn:active {
            transform: scale(0.9);
            opacity: 0.6;
        }

        .back-btn svg {
            width: 24px;
            height: 24px;
            stroke: #000;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .detail-title {
            font-size: 17px;
            font-weight: 600;
            color: #000;
            flex: 1;
            text-align: center;
        }

        /* 主内容区 */
        .main-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0 16px 40px 16px;
            -webkit-overflow-scrolling: touch;
        }

        /* 隐藏滚动条 */
        .main-content::-webkit-scrollbar {
            display: none;
        }

        .main-content {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 版本信息卡片 */
        .version-card {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 12px;
        }

        .version-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 0.5px solid #E5E5EA;
        }

        .version-row:last-child {
            border-bottom: none;
        }

        .version-label {
            font-size: 17px;
            font-weight: 400;
            color: #000;
        }

        .version-value {
            font-size: 17px;
            font-weight: 600;
            color: #8E8E93;
        }

        /* 文件选择卡片 */
        .file-select-card {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 12px;
        }

        .file-select-title {
            font-size: 20px;
            font-weight: 600;
            color: #000;
            margin-bottom: 8px;
        }

        .file-select-desc {
            font-size: 15px;
            color: #8E8E93;
            margin-bottom: 20px;
        }

        /* 文件输入区域 */
        .file-input-wrapper {
            margin-bottom: 16px;
            cursor: pointer;
        }

        .file-input-display {
            border: 2px dashed #D1D1D6;
            border-radius: 12px;
            padding: 32px 20px;
            text-align: center;
            background: #F9F9F9;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .file-input-display:active {
            background: #F0F0F0;
            border-color: #0052CC;
        }

        .file-input-display svg {
            color: #8E8E93;
        }

        .file-input-display span {
            font-size: 16px;
            color: #8E8E93;
            font-weight: 500;
        }

        .file-input-display.has-file {
            border-color: #34C759;
            border-style: solid;
            background: #F0FDF4;
        }

        .file-input-display.has-file svg {
            color: #34C759;
        }

        .file-input-display.has-file span {
            color: #34C759;
        }

        /* 升级按钮 */
        .upgrade-button {
            width: 100%;
            height: 54px;
            background: #0052CC;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 82, 204, 0.2);
        }

        .upgrade-button:active {
            transform: scale(0.98);
            background: #003B99;
        }

        .upgrade-button:disabled {
            background: #E5E5EA;
            color: #8E8E93;
            cursor: not-allowed;
            box-shadow: none;
        }

        .upgrade-button:disabled:active {
            transform: none;
        }

        /* 进度卡片 */
        .progress-card {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 12px;
        }

        .progress-title {
            font-size: 20px;
            font-weight: 600;
            color: #000;
            margin-bottom: 8px;
        }

        .progress-desc {
            font-size: 15px;
            color: #FF9500;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .progress-bar-container {
            margin-top: 16px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #E5E5EA;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #0052CC, #0066FF);
            border-radius: 4px;
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 15px;
            color: #000;
            text-align: center;
            font-weight: 600;
        }

        /* 隐藏状态 */
        .hidden {
            display: none !important;
        }

        /* 底部指示条 */
        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 5px;
            background: #000;
            border-radius: 3px;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="iphone-frame">
        <!-- 灵动岛 -->
        <div class="dynamic-island"></div>

        <!-- 屏幕内容 -->
        <div class="screen">
            <!-- 状态栏 -->
            <div class="status-bar">
                <div class="time">9:41</div>
                <div class="status-icons">
                    <div class="signal">
                        <div class="signal-bar"></div>
                        <div class="signal-bar"></div>
                        <div class="signal-bar"></div>
                        <div class="signal-bar"></div>
                    </div>
                    <div class="wifi"></div>
                    <div class="battery"></div>
                </div>
            </div>

            <!-- 主内容区 -->
            <div class="main-content">
                <!-- 顶部导航栏 -->
                <div class="detail-header">
                    <button class="back-btn" onclick="goBack()">
                        <svg viewBox="0 0 24 24">
                            <path d="M15 18l-6-6 6-6"/>
                        </svg>
                    </button>
                    <div class="detail-title" id="pageTitle">OTA升级</div>
                    <div style="width: 36px;"></div>
                </div>

                <!-- 版本信息卡片 -->
                <div class="version-card">
                    <div class="version-row">
                        <span class="version-label" id="currentVersionLabel">当前版本</span>
                        <span class="version-value" id="currentVersion">1.0.0</span>
                    </div>
                </div>

                <!-- 文件选择卡片 -->
                <div class="file-select-card">
                    <div class="file-select-title" id="fileSelectTitle">选择固件文件</div>
                    <div class="file-select-desc" id="fileSelectDesc">从手机存储选择固件文件</div>

                    <div class="file-input-wrapper" onclick="selectFile()">
                        <input type="file" id="fileInput" style="display: none;" onchange="handleFileSelect(event)">
                        <div class="file-input-display" id="fileDisplay">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            <span id="fileDisplayText">点击选择文件</span>
                        </div>
                    </div>

                    <!-- 升级按钮（初始置灰） -->
                    <button class="upgrade-button" id="upgradeBtn" onclick="startUpgrade()" disabled>
                        <span id="upgradeBtnText">开始升级</span>
                    </button>
                </div>

                <!-- 升级进度卡片（初始隐藏） -->
                <div class="progress-card hidden" id="progressCard">
                    <div class="progress-title" id="progressTitle">正在升级</div>
                    <div class="progress-desc" id="progressDesc">请勿关闭电源或断开连接</div>
                    <div class="progress-bar-container">
                        <div class="progress-bar">
                            <div class="progress-fill" id="upgradeFill"></div>
                        </div>
                        <div class="progress-text" id="upgradeText">0%</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 多语言配置
        const i18n = {
            '中文': {
                pageTitle: 'OTA升级',
                currentVersionLabel: '当前版本',
                fileSelectTitle: '选择固件文件',
                fileSelectDesc: '从手机存储选择固件文件',
                clickToSelect: '点击选择文件',
                fileSelected: '✓ 已选择: ',
                upgradeBtnText: '开始升级',
                progressTitle: '正在升级',
                progressDesc: '请勿关闭电源或断开连接',
                upgradeSuccess: '升级成功！'
            },
            '繁體中文': {
                pageTitle: 'OTA升級',
                currentVersionLabel: '當前版本',
                fileSelectTitle: '選擇固件文件',
                fileSelectDesc: '從手機存儲選擇固件文件',
                clickToSelect: '點擊選擇文件',
                fileSelected: '✓ 已選擇: ',
                upgradeBtnText: '開始升級',
                progressTitle: '正在升級',
                progressDesc: '請勿關閉電源或斷開連接',
                upgradeSuccess: '升級成功！'
            },
            'English': {
                pageTitle: 'OTA Upgrade',
                currentVersionLabel: 'Current Version',
                fileSelectTitle: 'Select Firmware File',
                fileSelectDesc: 'Select firmware file from phone storage',
                clickToSelect: 'Click to select file',
                fileSelected: '✓ Selected: ',
                upgradeBtnText: 'Start Upgrade',
                progressTitle: 'Upgrading',
                progressDesc: 'Do not power off or disconnect',
                upgradeSuccess: 'Upgrade Successful!'
            }
        };

        // 当前语言
        let currentLang = localStorage.getItem('preferredLanguage') || 'English';

        // 当前版本
        const CURRENT_VERSION = '1.0.0';

        // 选中的文件
        let selectedFile = null;

        // 更新界面语言
        function updateLanguage() {
            const texts = i18n[currentLang];
            if (!texts) return;

            document.getElementById('pageTitle').textContent = texts.pageTitle;
            document.getElementById('currentVersionLabel').textContent = texts.currentVersionLabel;
            document.getElementById('fileSelectTitle').textContent = texts.fileSelectTitle;
            document.getElementById('fileSelectDesc').textContent = texts.fileSelectDesc;
            document.getElementById('fileDisplayText').textContent = texts.clickToSelect;
            document.getElementById('upgradeBtnText').textContent = texts.upgradeBtnText;
            document.getElementById('progressTitle').textContent = texts.progressTitle;
            document.getElementById('progressDesc').textContent = texts.progressDesc;
        }

        // 初始化页面
        function initPage() {
            // 更新版本号显示
            document.getElementById('currentVersion').textContent = CURRENT_VERSION;
        }

        // 选择文件
        function selectFile() {
            document.getElementById('fileInput').click();
        }

        // 处理文件选择
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            selectedFile = file;
            const texts = i18n[currentLang];
            const fileDisplay = document.getElementById('fileDisplay');
            const fileDisplayText = document.getElementById('fileDisplayText');
            const upgradeBtn = document.getElementById('upgradeBtn');

            // 更新文件显示区域
            fileDisplay.classList.add('has-file');
            fileDisplayText.textContent = texts.fileSelected + file.name;

            // 启用升级按钮
            upgradeBtn.disabled = false;
        }

        // 开始升级
        function startUpgrade() {
            if (!selectedFile) return;

            const texts = i18n[currentLang];
            const upgradeBtn = document.getElementById('upgradeBtn');
            const progressCard = document.getElementById('progressCard');
            const upgradeFill = document.getElementById('upgradeFill');
            const upgradeText = document.getElementById('upgradeText');

            // 隐藏升级按钮，显示进度卡片
            upgradeBtn.disabled = true;
            progressCard.classList.remove('hidden');

            // 开始升级进度
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 12;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);

                    // 升级完成
                    upgradeText.textContent = texts.upgradeSuccess;

                    setTimeout(() => {
                        alert(texts.upgradeSuccess + '\n设备将重启...');
                        // 实际应用中，这里会触发设备重启
                        location.reload();
                    }, 1000);
                } else {
                    upgradeText.textContent = Math.floor(progress) + '%';
                }

                upgradeFill.style.width = progress + '%';
            }, 180);
        }

        // 返回上一页
        function goBack() {
            window.location.href = 'profile-3menu.html';
        }

        // 页面加载时初始化
        window.addEventListener('DOMContentLoaded', function() {
            initPage();       // 初始化页面
            updateLanguage(); // 更新语言
        });
    </script>
</body>
</html>
